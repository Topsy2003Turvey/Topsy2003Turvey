<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="850" height="168" viewBox="0 0 850 168" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22082c"/>
      <stop offset="45%" stop-color="#120018"/>
      <stop offset="100%" stop-color="#1a0830"/>
    </linearGradient>
    <linearGradient id="neonStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#ff2ea6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#ff2ea6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wave">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="2" seed="2" result="t">
        <animate attributeName="baseFrequency" values="0.015 0.04;0.03 0.02;0.015 0.04" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="842" height="9999" rx="22"/>
    </clipPath>
  </defs>

  <rect x="5" y="5" width="840" height="158" rx="22" fill="none" stroke="#ff2ea6" stroke-width="6" opacity="0.35" filter="url(#glow)"/>
  <rect x="8" y="8" width="834" height="152" rx="20" fill="url(#bg)" stroke="url(#neonStroke)" stroke-width="2.5"/>
  
  <rect x="8" y="-16" width="834" height="10" fill="#ff2ea6" opacity="0.07" clip-path="url(#cardClip)">
    <animate attributeName="y" values="-16;168;-16" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="38" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">WHOAMI</text>
  <text x="28" y="64" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">topsy2003turvey@night-city:~$ whoami</text>
  <text x="28" y="92" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Studying for a Bachelor of Science Honours in IT Specializing in Data Science</text>
  <text x="28" y="118" fill="#ffb3ec" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">location: South Africa  ·  timezone: UTC+02  ·  status: Focusing</text>
  <text x="28" y="142" fill="#c4a0d8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Butler: Goeiedag, Meneer! Mag u 'n produktiewe sessie hê.</text>
</svg>