<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="850" height="280" viewBox="0 0 850 280" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22082c"/>
      <stop offset="45%" stop-color="#120018"/>
      <stop offset="100%" stop-color="#1a0830"/>
    </linearGradient>
    <linearGradient id="neonStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#ff2ea6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#ff2ea6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="wave">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="2" seed="2" result="t">
        <animate attributeName="baseFrequency" values="0.015 0.04;0.03 0.02;0.015 0.04" dur="5s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="4" y="4" width="842" height="9999" rx="22"/>
    </clipPath>
  </defs>

  <rect x="5" y="5" width="840" height="270" rx="22" fill="none" stroke="#ff2ea6" stroke-width="6" opacity="0.35" filter="url(#glow)"/>
  <rect x="8" y="8" width="834" height="264" rx="20" fill="url(#bg)" stroke="url(#neonStroke)" stroke-width="2.5"/>
  
  <rect x="8" y="-16" width="834" height="10" fill="#ff2ea6" opacity="0.07" clip-path="url(#cardClip)">
    <animate attributeName="y" values="-16;280;-16" dur="5.5s" repeatCount="indefinite"/>
  </rect>
  <text x="28" y="38" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">ANIMATED STATS</text>
  <text x="28" y="64" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Profile Signal</text>
  <text x="28" y="88" fill="#c4a0d8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Live GitHub stats · Twilight / Pretoria</text>
  <g transform="translate(42,122)">
    <text x="0" y="38" fill="#ff2ea6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" filter="url(#glow)">0</text>
    <text x="0" y="76" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Stars</text>
    <rect x="0" y="92" width="150" height="8" rx="4" fill="#2a1538"/>
    <rect x="0" y="92" width="0" height="8" rx="4" fill="url(#barPink)">
      <animate attributeName="width" from="0" to="12" dur="1.4s" begin="0.2s" fill="freeze"/>
    </rect>
  </g>  <g transform="translate(232,122)">
    <text x="0" y="38" fill="#ff2ea6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" filter="url(#glow)">50</text>
    <text x="0" y="76" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Contributions</text>
    <rect x="0" y="92" width="150" height="8" rx="4" fill="#2a1538"/>
    <rect x="0" y="92" width="0" height="8" rx="4" fill="url(#barPink)">
      <animate attributeName="width" from="0" to="75" dur="1.4s" begin="0.38s" fill="freeze"/>
    </rect>
  </g>  <g transform="translate(422,122)">
    <text x="0" y="38" fill="#ff2ea6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" filter="url(#glow)">2</text>
    <text x="0" y="76" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Repos</text>
    <rect x="0" y="92" width="150" height="8" rx="4" fill="#2a1538"/>
    <rect x="0" y="92" width="0" height="8" rx="4" fill="url(#barPink)">
      <animate attributeName="width" from="0" to="37" dur="1.4s" begin="0.56s" fill="freeze"/>
    </rect>
  </g>  <g transform="translate(612,122)">
    <text x="0" y="38" fill="#ff2ea6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="800" filter="url(#glow)">8</text>
    <text x="0" y="76" fill="#ffe6fb" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">Followers</text>
    <rect x="0" y="92" width="150" height="8" rx="4" fill="#2a1538"/>
    <rect x="0" y="92" width="0" height="8" rx="4" fill="url(#barPink)">
      <animate attributeName="width" from="0" to="48" dur="1.4s" begin="0.74s" fill="freeze"/>
    </rect>
  </g>
</svg>